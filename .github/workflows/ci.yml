name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MOCK_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/eval.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the container
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          curl -fsS http://localhost:8000/ | grep -q "Brightsmile Dental"
          curl -fsS -X POST http://localhost:8000/api/chat -H 'Content-Type: application/json' \
            -d '{"message":"Are you open on Saturday?"}' | tee /dev/stderr | grep -q '"type":"answer"'
      - if: always()
        run: docker compose logs && docker compose down
